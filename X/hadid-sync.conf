# Hadid sync configuration (sourced by hadid-sync.sh)
# Local path: git clone content under X/hadid
LOCAL_DIR="/home/server/X/hadid/Hadid"

# Nextcloud WebDAV remote path (rclone remote "nc")
REMOTE="nc:DLT/Hadid"

# rclone remote name (for health checks)
RCLONE_REMOTE="nc"

# Auto-sync: push | pull | bisync
AUTO_MODE="pull"

# Cron schedule (default: every 5 minutes)
CRON_SCHEDULE="*/5 * * * *"

# Log file
LOG_FILE="/home/server/X/hadid-sync.log"
