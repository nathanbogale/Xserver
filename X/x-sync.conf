# X team sync configuration (sourced by x-sync.sh)
# Local path: host folder under X/
LOCAL_DIR="/home/server/X/x"

# Nextcloud WebDAV remote path (rclone remote "nc") — X Team Folder root
REMOTE="nc:X"

# rclone remote name (for health checks)
RCLONE_REMOTE="nc"

# Auto-sync: push | pull | bisync
AUTO_MODE="pull"

# Cron schedule (default: every 5 minutes)
CRON_SCHEDULE="*/5 * * * *"

# Log file
LOG_FILE="/home/server/X/x-sync.log"
