version: "3.8"

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - x_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - x_net

  app:
    image: nextcloud:latest
    restart: unless-stopped
    depends_on:
      - db
      - redis
    ports:
      - "127.0.0.1:8300:80"
    volumes:
      - ./data:/var/www/html/data
      - ./custom_apps:/var/www/html/custom_apps
      - nextcloud_html:/var/www/html
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS}
      OVERWRITEHOST: ${NEXTCLOUD_OVERWRITEHOST}
      OVERWRITEPROTOCOL: ${NEXTCLOUD_OVERWRITEPROTOCOL}
      OVERWRITECLIURL: https://x.decentral.technology
    networks:
      - x_net

  cron:
    image: nextcloud:latest
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./data:/var/www/html/data
      - ./custom_apps:/var/www/html/custom_apps
      - nextcloud_html:/var/www/html
    entrypoint: /cron.sh
    networks:
      - x_net

  collabora:
    image: collabora/code:latest
    restart: unless-stopped
    privileged: true
    ports:
      - "127.0.0.1:8301:9980"
    environment:
      - domain=x\\.decentral\\.technology
      - server_name=${COLLABORA_DOMAIN}
      - aliasgroup1=https://x.decentral.technology:443,http://app
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true --o:logging.level=information --o:net.frame_ancestors=https://x.decentral.technology
      - DONT_GEN_SSL_CERT=true
    cap_add:
      - MKNOD
      - SYS_ADMIN
    networks:
      - x_net

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]

  whiteboard:
    image: ghcr.io/nextcloud-releases/whiteboard:stable
    restart: unless-stopped
    ports:
      - "127.0.0.1:8303:3002"
    environment:
      NEXTCLOUD_URL: https://x.decentral.technology
      JWT_SECRET_KEY: ${WHITEBOARD_JWT_SECRET}
    networks:
      - x_net

volumes:
  db_data:
  nextcloud_html:

networks:
  x_net:
    driver: bridge
